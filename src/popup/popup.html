<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NurseApply</title>
<link rel="stylesheet" href="../ui/theme.css">
<style>
  body { width: 320px; }
  .shell { padding: 16px; max-width: none; }
  .masthead { margin-bottom: 14px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .line { font-size: 12.5px; color: var(--ink-dim); line-height: 1.6; }
  .line b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <div class="mark">NA</div>
      <div><h1 style="font-size:16px">NurseApply</h1>
      <p id="where">Checking this tab…</p></div>
    </div>
  </header>

  <div class="line" id="stats"></div>

  <div id="enable-wrap" class="hidden" style="margin-top:12px">
    <p class="line" style="margin:0 0 8px">Hospital careers pages sit on thousands of different
    domains, so NurseApply only runs where you switch it on.</p>
    <button id="enable" class="primary" style="width:100%">Turn on for this site</button>
    <p class="line" id="enable-note" style="margin:8px 0 0"></p>
    <p class="line" id="enable-host" style="display:none"></p>
  </div>

  <div style="height:12px"></div>
  <div class="stack">
    <button id="fill" class="primary">Fill this step</button>
    <button id="clear" class="ghost">Clear highlights</button>
    <button id="profile" class="ghost">Edit profile</button>
    <button id="tracker" class="ghost">Application tracker</button>
  </div>
  <div style="height:12px"></div>
  <p class="line">NurseApply never clicks Submit and never answers questions about
  discipline, termination, criminal history or exclusions.</p>
</div>
<script src="../schema/profile.js"></script>
<script src="../lib/storage.js"></script>
<script src="popup.js"></script>
</body>
</html>
