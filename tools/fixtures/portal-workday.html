<!doctype html><html><head><meta charset="utf-8"><title>Acme Health Careers</title></head>
<body>
<h1 data-automation-id="jobPostingHeader">Registered Nurse II, MICU</h1>
<div data-automation-id="progressBarActiveStep">My Information</div>
<form>
  <div data-automation-id="formField-legalNameSection_firstName">
    <label for="fn">First Name</label><input id="fn" data-automation-id="legalNameSection_firstName">
  </div>
  <div data-automation-id="formField-legalNameSection_lastName">
    <label for="ln">Last Name</label><input id="ln" data-automation-id="legalNameSection_lastName">
  </div>
  <div><label for="em">Email Address</label><input id="em" data-automation-id="email"></div>
  <div><label for="ph">Phone Number</label><input id="ph" data-automation-id="phone-number"></div>
  <div><label for="city">City</label><input id="city" data-automation-id="addressSection_city"></div>
  <div><label for="lic">RN License Number</label><input id="lic" name="license_number"></div>
  <fieldset><legend>Have you ever been convicted of a felony?</legend>
    <label><input type="radio" name="felony" value="y"> Yes</label>
    <label><input type="radio" name="felony" value="n"> No</label>
  </fieldset>
  <button type="button" id="next">Next</button>
</form>
</body></html>
